# Locust configuration for production testing
# Usage: locust -f tests/load/locustfile.py --config=tests/load/locust_production.conf

# Production URL
host = https://sentiment-api-vpmz.onrender.com

# Gentle load for free tier
users = 20
spawn-rate = 2
run-time = 120s

# Web UI disabled for headless mode
headless = true

# Output results
html = tests/load/results/production_report.html
csv = tests/load/results/production