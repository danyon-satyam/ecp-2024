# PR Quality Checks
#
# Runs on every Pull Request targeting develop or main.
# Faster than the full CI pipeline — focused on code quality.
# Developers get feedback within 2 minutes of opening a PR.
#
# Checks:
#   1. Code formatting (no syntax errors)
#   2. Import validity (all imports resolve correctly)
#   3. Full test suite with coverage gate
#   4. Verify no debug code left in

name: PR Quality Checks

on:
  pull_request:
    branches: [ main, develop ]

jobs:
  quality:
    name: Code Quality
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sentiment_db_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check for syntax errors
        run: |
          python -m py_compile app/main.py
          python -m py_compile app/core/config.py
          python -m py_compile app/core/database.py
          python -m py_compile app/core/exceptions.py
          python -m py_compile app/core/error_handlers.py
          python -m py_compile app/services/sentiment.py
          python -m py_compile app/services/feedback_repository.py
          python -m py_compile app/api/v1/endpoints/feedback.py
          python -m py_compile app/api/v1/endpoints/analytics.py
          python -m py_compile app/api/v1/endpoints/visualisations.py
          echo "No syntax errors found"

      - name: Check for debug code
        run: |
          # Fail if any print() statements exist in app/ (excluding ml_model.py which uses print for logging)
          if grep -rn "print(" app/ --include="*.py" \
            --exclude="app/services/ml_model.py" \
            --exclude="app/core/error_handlers.py"; then
            echo "WARNING: print() statements found in app/ — use proper logging instead"
          fi
          echo "Debug check complete"

      - name: Run Alembic migrations
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/sentiment_db_test
        run: alembic upgrade head

      - name: Run tests with coverage gate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/sentiment_db_test
        run: |
          pytest --tb=short -v --cov=app --cov-report=term-missing --cov-fail-under=80

      - name: PR Summary
        if: always()
        run: |
          echo "PR checks completed"
          echo "Branch: ${{ github.head_ref }}"
          echo "Target: ${{ github.base_ref }}"