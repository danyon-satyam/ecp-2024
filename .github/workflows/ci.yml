# CI Pipeline for Student Sentiment Analysis API
#
# This workflow runs automatically on every push and pull request.
# It installs dependencies, runs linting checks, and executes the full
# test suite to ensure nothing is broken before code reaches the main branch.
#
# Why CI? In enterprise teams, no one manually runs tests before pushing.
# This pipeline acts as an automated quality gate — broken code is caught
# immediately, not discovered later in production.

name: CI Pipeline

# Triggers: when does this workflow run?
on:
  push:
    branches: [ main, develop ]   # Run on every push to main or develop
  pull_request:
    branches: [ main ]            # Run on every PR targeting main

jobs:
  test:
    name: Run Tests
    # The virtual machine GitHub uses to run our pipeline
    runs-on: ubuntu-latest

    strategy:
      matrix:
        # Test against multiple Python versions to ensure compatibility
        python-version: ["3.11", "3.12"]

    steps:
      # Step 1: Check out the repository code onto the GitHub runner
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Set up the Python version we want to test with
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # Step 3: Cache pip dependencies so the pipeline runs faster
      # If requirements.txt hasn't changed, GitHub reuses the cached packages
      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      # Step 4: Install all project dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Step 5: Run the full Pytest test suite
      # --tb=short shows short traceback on failure (easier to read in CI logs)
      # --cov generates a coverage report showing % of code tested
      - name: Run tests
        run: |
          pytest --tb=short -v

      # Step 6: Print a summary of which tests passed or failed
      - name: Test Summary
        if: always()
        run: |
          echo "CI pipeline completed for Python ${{ matrix.python-version }}"